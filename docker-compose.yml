services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: subtrack_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-subtrack}
      DB_USERNAME: ${DB_USERNAME:-subtrack}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  db:
    image: mysql:8.0
    container_name: subtrack_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-subtrack}
      MYSQL_USER: ${DB_USERNAME:-subtrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  app_storage:
  app_logs:
